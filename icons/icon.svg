<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="onionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#7e22ce" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Arka Plan Kalkan / Çerçeve -->
  <circle cx="64" cy="64" r="60" fill="#0f172a" stroke="url(#shieldGrad)" stroke-width="4" filter="url(#glow)"/>
  
  <!-- Tor Soğan Katmanları -->
  <!-- Katman 1 (Dış) -->
  <path d="M 64,22 C 38,22 28,48 28,70 C 28,94 44,106 64,106 C 84,106 100,94 100,70 C 100,48 90,22 64,22 Z" 
        fill="url(#onionGrad)" opacity="0.85"/>
  
  <!-- Katman 2 (Orta) -->
  <path d="M 64,32 C 45,32 40,52 40,70 C 40,88 50,98 64,98 C 78,98 88,88 88,70 C 88,52 83,32 64,32 Z" 
        fill="#1e1b4b" opacity="0.9" stroke="#c084fc" stroke-width="2"/>
        
  <!-- Katman 3 (İç Çekirdek) -->
  <path d="M 64,44 C 53,44 50,56 50,70 C 50,82 56,90 64,90 C 72,90 78,82 78,70 C 78,56 75,44 64,44 Z" 
        fill="url(#shieldGrad)"/>

  <!-- Soğan Filizi (Tepe) -->
  <path d="M 64,14 C 62,18 61,22 64,26 C 67,22 66,18 64,14 Z" fill="#22c55e" />
  
  <!-- Devre / Cyber Çizgileri -->
  <circle cx="64" cy="70" r="4" fill="#ffffff" filter="url(#glow)" />
  <line x1="64" y1="74" x2="64" y2="88" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2,2"/>
</svg>
